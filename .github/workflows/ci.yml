name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bunx biome ci

      # The npm package is a Node bundle: build it and run it on the oldest
      # Node it supports (zstd in node:zlib arrived in 22.15).
      - run: bun run build:npm
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15"
      - run: scripts/smoke.sh node dist/frisk.js
