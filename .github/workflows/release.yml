name: Release

# Push a tag like v0.1.0 (matching package.json and FRISK_VERSION) to publish
# friskme (one plain-JS bundle for Node) to npm and attach the compiled
# binaries to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run typecheck
      - run: bunx biome ci

      - name: Build binaries
        run: bun run build:release
      - name: Build the npm bundle
        run: bun run build:npm
      - name: Lay out the npm package
        run: bun scripts/pack-npm.ts "${GITHUB_REF_NAME#v}"

      - name: Smoke test the installed package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/tgz" "$RUNNER_TEMP/smoke"
          npm pack dist/npm/friskme --pack-destination "$RUNNER_TEMP/tgz"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/tgz/friskme-$version.tgz"
          test "$(npx --no-install frisk --version)" = "$version"
          test "$(npx --no-install friskme --version)" = "$version"
          "$GITHUB_WORKSPACE/scripts/smoke.sh" npx --no-install frisk

      # Trusted publishing (OIDC, via id-token: write above) needs npm >= 11.5.1;
      # Node 22 ships npm 10. No npm token is used.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Publish to npm
        # Trusted publishing adds provenance by default (public repos only).
        run: npm publish dist/npm/friskme --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum frisk-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" frisk-* SHA256SUMS --generate-notes
